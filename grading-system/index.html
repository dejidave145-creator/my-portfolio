<!DOCTYPE html>
<html>
<head>
    <title>Student Grading System | Ayodele David Ayodeji</title>

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .grading-box {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-top: 0;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #475569;
            border-radius: 7px;
            background-color: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0ea5e9;
        }

        #result {
            margin-top: 20px;
            color: #cbd5e1;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="grading-box">
        <h1>Student Grading System</h1>

        <input type="number" id="score" placeholder="Enter student score">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateGrade() {
            const score = Number(document.getElementById("score").value);
            const result = document.getElementById("result");

            if (score < 0 || score > 100 || document.getElementById("score").value === "") {
                result.innerHTML = "Please enter a valid score between 0 and 100.";
            } else if (score >= 70) {
                result.innerHTML = "Grade: A<br>Excellent performance!";
            } else if (score >= 60) {
                result.innerHTML = "Grade: B<br>Very good performance!";
            } else if (score >= 50) {
                result.innerHTML = "Grade: C<br>Good performance.";
            } else if (score >= 45) {
                result.innerHTML = "Grade: D<br>Fair performance.";
            } else if (score >= 40) {
                result.innerHTML = "Grade: E<br>Pass.";
            } else {
                result.innerHTML = "Grade: F<br>Fail.";
            }
        }
    </script>

</body>
</html>
